<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Default title only; per-route <title> + <meta description> are managed by
         react-helmet-async (see client/src/components/Seo.tsx). The description meta
         is intentionally NOT hard-coded here so Helmet owns a single, per-route copy. -->
    <title>The Engineering Business Academy — For Engineering Contractors</title>

    <!-- Favicon -->
    <!-- Favicon — the "THE EBA" tile from the brand asset pack -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Brand typeface: Poppins only (600/700 headings · 300/400 body).
         Playfair Display / DM Sans removed — do not ship unused fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

    <!-- Plausible — privacy-first, cookieless analytics for custom events.
         data-domain lists both the live Vercel URL (works now) and the future
         custom domain, so events attribute correctly before and after teb-academy.com
         is connected. Create the matching site(s) at plausible.io to see data.
         Until then this script 404s harmlessly and track() no-ops. -->
    <script defer data-domain="teb-academy.com,eba-site.vercel.app" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
