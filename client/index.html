<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Default title only; per-route <title> + <meta description> are managed by
         react-helmet-async (see client/src/components/Seo.tsx). The description meta
         is intentionally NOT hard-coded here so Helmet owns a single, per-route copy. -->
    <title>The Engineering Business Academy — For M&E Contractors</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- EBA Premium: Playfair Display (headings 700/800/900) + DM Sans (body 400/500/600/700) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />

    <!-- Plausible — privacy-first, cookieless analytics for custom events.
         data-domain lists both the live Vercel URL (works now) and the future
         custom domain, so events attribute correctly before and after eba.academy
         is connected. Create the matching site(s) at plausible.io to see data.
         Until then this script 404s harmlessly and track() no-ops. -->
    <script defer data-domain="eba.academy,eba-site.vercel.app" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
